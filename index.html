<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Menú de pestañas superior -->
  <nav class="tabs">
    <button class="tab active" data-target="inicio">Inicio</button>
    <button data-target="busqueda">Búsqueda</button>
    <button data-target="filtrarPorClima">Filtro</button>
    <button data-target="favoritos">Favoritos</button>
    <button data-target="registro">Registro</button>
    <button data-target="configuracion">Configuración</button>
  </nav>


  <section id="busqueda" class="section" style="display:none">
    <h2>Buscar ciudad</h2>
    <input id="buscarCiudad" type="text" placeholder="Buscar ciudad">
<button id="buscarBtn">Buscar</button>
  </section>

  <section id="filtrarPorClima" class="section" style="display:none" >
    <h2>Filtrar</h2>
    <select id="filtroClima" onchange="filtrarPorClima()">
      <option value="todos">Todos</option>
      <option value="soleado">Soleado</option>
      <option value="lluvia">Lluvia</option>
      <option value="nieve">Nieve</option>
      <option value="niebla">Niebla</option>
      <option value="nublado">Nublado</option>
    </select>
  </section>

  <section id="favoritos" class="section" style="display:none">
    <h2>Favoritos</h2>
    <ul id="listaFavoritos"></ul>
  </section>

  <!-- Secciones -->
  <section id="inicio" class="section">
    <h2>Clima Actual</h2>
    <div id="infoClima"></div>
    <div id="ciudadesContainer" class="grid-container"></div>
  </section>



  <section id="registro" class="section" style="display:none">
    <h2>Registro</h2>
    <form id="formRegistro">
      <input type="text" id="nombre" placeholder="Nombre" required/>
      <input type="email" id="email" placeholder="Correo electrónico" required/>
      <input type="password" id="password" placeholder="Contraseña" required/>
      <input type="text" placeholder="Dirección" required/>
      <input type="text" placeholder="Ciudad" required/>
      <input type="tel" placeholder="Teléfono" required/>
      <input type="date" placeholder="Fecha de nacimiento" required/>
      <button type="submit">Registrarse</button>
    </form>
  </section>

  <div id="resultadoClima"></div>

  

  <section id="configuracion" class="seccion" style="display:none">
    <h2>Configuración</h2>
    <p>Funcionalidad original: cambio de tema próximamente 🔧</p>
  </section>

  <!-- Menú inferior -->
  <footer class="tabs">
    <button data-target="inicio">Inicio</button>
    <button data-target="favoritos">Favoritos</button>
    <button data-target="registro">Registro</button>
    <button data-target="configuracion">Config</button>
  </footer>

  <script src="/js/app.js" type="module"></script>

  
</body>
</html>
