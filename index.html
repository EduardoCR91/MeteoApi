<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MeteoApp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Menú de pestañas superior -->
  <nav class="tabs">
    <button class="tab active" data-target="inicio" onclick="irAInicio()">Inicio</button>
    <button onclick="mostrarSeccion('busqueda')">Búsqueda</button>
    <button onclick="mostrarSeccion('filtro')">Filtro</button>
    <button onclick="mostrarSeccion('favoritos')">Favoritos</button>
    <button onclick="mostrarSeccion('registro')">Registro</button>
    <button onclick="mostrarSeccion('configuracion')">Configuración</button>
  </nav>

  <!-- Secciones -->
  <section id="inicio" class="seccion">
    <h2>Clima Actual</h2>
    <div id="infoClima"></div>
  </section>

  <section id="busqueda" class="seccion" style="display:none">
    <h2>Buscar ciudad</h2>
    <input id="buscarCiudad" type="text" placeholder="Buscar ciudad">
<button id="buscarBtn">Buscar</button>
  </section>

  <section id="filtro" class="seccion" style="display:none">
    <h2>Filtrar</h2>
    <select id="filtro" onchange="aplicarFiltro()">
      <option value="todos">Todos</option>
      <option value="soleado">Soleado</option>
      <option value="lluvioso">Lluvioso</option>
    </select>
  </section>

  <section id="favoritos" class="seccion" style="display:none">
    <h2>Favoritos</h2>
    <ul id="listaFavoritos"></ul>
  </section>

  <section id="registro" class="seccion" style="display:none">
    <h2>Registro</h2>
    <form onsubmit="registrarUsuario(event)">
      <input type="text" id="nombre" placeholder="Nombre" required/>
      <input type="email" id="email" placeholder="Correo electrónico" required/>
      <input type="password" id="password" placeholder="Contraseña" required/>
      <input type="text" placeholder="Dirección" required/>
      <input type="text" placeholder="Ciudad" required/>
      <input type="tel" placeholder="Teléfono" required/>
      <input type="date" placeholder="Fecha de nacimiento" required/>
      <button type="submit">Registrarse</button>
    </form>
  </section>

  <div id="resultadoClima"></div>

  <ul id="listaFavoritos"></ul>

  <section id="configuracion" class="seccion" style="display:none">
    <h2>Configuración</h2>
    <p>Funcionalidad original: cambio de tema próximamente 🔧</p>
  </section>

  <!-- Menú inferior -->
  <footer>
    <button class="tab active" data-target="inicio" onclick="irAInicio()">Inicio</button>
    <button onclick="mostrarSeccion('favoritos')">Favoritos</button>
    <button onclick="mostrarSeccion('registro')">Registro</button>
    <button onclick="mostrarSeccion('configuracion')">Config</button>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
